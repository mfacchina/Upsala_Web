<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { width: 1200px; height: 630px; overflow: hidden; font-family: "Segoe UI", Inter, system-ui, sans-serif; }
      .card {
        position: relative; width: 1200px; height: 630px; color: #fff;
        background: radial-gradient(ellipse at 80% 20%, #2f87d6 0%, #163b62 45%, #0c2640 100%);
      }
      .photo {
        position: absolute; right: 0; top: 0; height: 630px; width: 620px; object-fit: cover; object-position: 45% 30%;
        -webkit-mask-image: linear-gradient(to right, transparent 0%, black 30%); mask-image: linear-gradient(to right, transparent 0%, black 30%);
        opacity: 0.95;
      }
      .bottle { position: absolute; right: 70px; bottom: -10px; height: 560px; filter: drop-shadow(0 40px 50px rgba(0,0,0,0.45)); }
      .logo { position: absolute; left: 72px; top: 64px; height: 92px; }
      .eyebrow { position: absolute; left: 72px; top: 190px; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: #7adcf0; font-weight: 600; }
      h1 { position: absolute; left: 72px; top: 232px; width: 560px; font-size: 64px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; }
      h1 span { color: #7adcf0; }
      .sub { position: absolute; left: 72px; top: 436px; width: 520px; font-size: 22px; line-height: 1.3; color: rgba(255,255,255,0.78); }
      .promo { position: absolute; left: 72px; bottom: 56px; display: inline-flex; align-items: center; gap: 12px; background: #f6b73c; color: #0c2640; font-weight: 800; font-size: 22px; padding: 12px 22px; border-radius: 999px; }
      .url { position: absolute; right: 56px; bottom: 44px; font-size: 20px; color: rgba(255,255,255,0.7); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="photo" src="../public/img/foto-familia-bidon.webp" alt="" />
      <img class="logo" src="../public/img/logo-blanco.png" alt="Upsala" />
      <div class="eyebrow">Agua mineral natural</div>
      <h1>Agua mineral natural, <span>en la puerta de tu casa.</span></h1>
      <p class="sub">Bidones de 12 y 20 L y dispenser frío/calor. Reparto a domicilio en CABA.</p>
      <div class="promo">50% en tu primer bidón</div>
      <div class="url">upsala.com.ar</div>
    </div>
  </body>
</html>
