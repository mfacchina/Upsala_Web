<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
<style>
  /* Foto de perfil de WhatsApp: cuadrada, pero se ve recortada en circulo.
     Todo lo importante va dentro del circulo central. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1000px; height: 1000px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1000px; height: 1000px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  .ring { position: absolute; inset: 36px; border-radius: 50%; border: 10px solid rgba(255,255,255,0.18); }
  .logo { height: 175px; margin-bottom: 18px; }
  .icon { width: 190px; height: 190px; border-radius: 50%; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; }
  .icon svg { width: 118px; height: 118px; }
  .label { font-family: Outfit, Inter, sans-serif; font-weight: 800; font-size: 104px; letter-spacing: -0.02em; line-height: 1; margin-top: 24px; text-align: center; }
  .label.long { font-size: 84px; }
  .sub { margin-top: 14px; font-size: 34px; font-weight: 600; color: rgba(255,255,255,0.9); text-align: center; max-width: 620px; line-height: 1.2; }
  .yesno { display: flex; gap: 26px; }
  .yesno span { width: 190px; height: 112px; border-radius: 32px; display: flex; align-items: center; justify-content: center; font-family: Outfit, Inter, sans-serif; font-weight: 800; font-size: 70px; box-shadow: 0 18px 36px -14px rgba(0,0,0,0.45); }
  .yes { background: #25d366; color: #fff; }
  .no { background: #fff; color: #c0392b; }
</style>
</head>
<body>
<div class="card" id="card"><div class="ring"></div></div>
<script>
  const ICONS = {
    // auriculares con microfono
    headset: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13" width="4" height="6" rx="1.5"/><rect x="17.5" y="13" width="4" height="6" rx="1.5"/><path d="M19.5 19v.5a2.5 2.5 0 0 1-2.5 2.5h-3"/><circle cx="12.5" cy="22" r="1.2" fill="#fff"/></svg>',
    // globo de chat con chispa (asistente automatico)
    bot: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"/><circle cx="8.5" cy="11" r="1.1" fill="#fff"/><circle cx="12" cy="11" r="1.1" fill="#fff"/><circle cx="15.5" cy="11" r="1.1" fill="#fff"/></svg>',
    // ruta: dos puntos unidos por un camino
    route: '<svg viewBox="2.6 2.8 18.8 18.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5a2.5 2.5 0 0 1 2.5 2.5c0 2-2.5 4.5-2.5 4.5S3.5 8 3.5 6A2.5 2.5 0 0 1 6 3.5z"/><circle cx="6" cy="6" r="0.6" fill="#fff"/><path d="M18 13.5a2.5 2.5 0 0 1 2.5 2.5c0 2-2.5 4.5-2.5 4.5s-2.5-2.5-2.5-4.5a2.5 2.5 0 0 1 2.5-2.5z"/><circle cx="18" cy="16" r="0.6" fill="#fff"/><path d="M6 13v1.5a3 3 0 0 0 3 3h3M12 6.5h3a3 3 0 0 1 3 3V11" stroke-dasharray="2 2.2"/></svg>',
    // camion de reparto
    truck: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h11v10H2zM13 9h4.5l3.5 3.5V16h-8"/><circle cx="6" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/></svg>',
  };
  const V = {
    central: { bg: "radial-gradient(circle at 50% 35%, #2470ba 0%, #163b62 55%, #0c2640 100%)", logo: "blanco", icon: "headset", label: "CENTRAL", sub: "Consultas, pagos y reclamos" },
    ventas: { bg: "radial-gradient(circle at 50% 35%, #2ddc6e 0%, #16a35a 55%, #0e7a45 100%)", logo: "blanco", icon: "bot", label: "VENTAS", sub: "Asistente virtual<br>Pedidos y clientes nuevos" },
    confirmacion: { bg: "radial-gradient(circle at 50% 35%, #3cc9e8 0%, #2f87d6 55%, #1f5c99 100%)", logo: "blanco", yesno: true, label: "CONFIRMACIÓN", long: true, sub: "¿Querés agua esta semana?<br>Respondé solo SÍ o NO" },
    repartidor1: { bg: "radial-gradient(circle at 50% 35%, #ffc65c 0%, #f39c12 55%, #c8700a 100%)", logo: "blanco", icon: "truck", label: "REPARTIDOR 1", long: true, sub: "Agua mineral natural" },
    grupo: { bg: "radial-gradient(circle at 50% 35%, #a78bfa 0%, #7c3aed 55%, #5b21b6 100%)", logo: "blanco", icon: "route", label: "REPARTO", sub: "Grupo del equipo" },
    repartidor2: { bg: "radial-gradient(circle at 50% 35%, #ff8a65 0%, #e8590c 55%, #b23f05 100%)", logo: "blanco", icon: "truck", label: "REPARTIDOR 2", long: true, sub: "Agua mineral natural" },
  };
  const v = V[location.hash.slice(1)] ?? V.central;
  const card = document.getElementById("card");
  card.style.background = v.bg;
  const middle = v.yesno
    ? '<div class="yesno"><span class="yes">SÍ</span><span class="no">NO</span></div>'
    : `<div class="icon">${ICONS[v.icon]}</div>`;
  card.insertAdjacentHTML(
    "beforeend",
    `<img class="logo" src="../../public/img/logo-${v.logo}.png" alt="Upsala" />${middle}<div class="label${v.long ? " long" : ""}">${v.label}</div><div class="sub">${v.sub}</div>`,
  );
</script>
</body>
</html>
